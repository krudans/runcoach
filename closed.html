<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>가지런 — 앱으로만 씁니다</title>
<style>
:root{color-scheme:light dark;--bg:#f6f4fa;--fg:#1c1830;--sub:#5d5873;--card:#fff;--line:#e3dfee;--pri:#5b3fd6;--prifg:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#14121d;--fg:#f1eefb;--sub:#a9a3bf;--card:#1e1b2b;--line:#322d45;--pri:#8f78ff;--prifg:#14121d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Noto Sans KR",sans-serif}
main{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px}
h1{margin:0 0 10px;font-size:22px;line-height:1.35}
p{margin:0 0 14px;color:var(--sub)}
a.btn{display:block;margin:20px 0 14px;padding:14px;border-radius:12px;background:var(--pri);color:var(--prifg);text-align:center;font-weight:700;text-decoration:none}
a.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
ol{margin:0 0 14px;padding-left:20px;color:var(--sub)}
small{display:block;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<main>
<h1>가지런은 이제 앱으로만 씁니다</h1>
<p>브라우저에서 쓰던 웹앱은 2026년 11월 13일에 끝났어요. 안드로이드 앱을 설치해 주세요.</p>
<a class="btn" href="https://github.com/krudans/runcoach/releases/download/test-apk/gajirun-test.apk">안드로이드 앱 내려받기</a>
<ol>
<li>내려받은 파일을 열어 설치</li>
<li>앱에서 쓰던 구글 계정으로 로그인</li>
</ol>
<p>구글 계정으로 저장해 둔 기록은 로그인하면 그대로 보여요.</p>
<small>아이폰용 앱은 없습니다.</small>
</main>
</body>
</html>
