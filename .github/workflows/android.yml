name: 안드로이드 앱 만들기

# 수동 실행(Actions 탭 → Run workflow) 또는 앱 껍데기 파일이 바뀌었을 때만 돈다.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-build/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 패키지 설치
        run: npm install --no-audit --no-fund
      - name: 웹앱 복사 + 다리 스크립트 끼우기
        run: node tools/prep.js
      - name: 안드로이드 프로젝트 만들기
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          npx cap add android
          node tools/android-patch.js
          npx cap sync android
      - name: 앱 아이콘 입히기
        continue-on-error: true
        run: |
          mkdir -p assets
          cp ../gaji-icon-512.png assets/logo.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#F3EFF8' --splashBackgroundColorDark '#F3EFF8'
      - name: 시험용 앱(APK) 빌드
        working-directory: android-build/android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 결과 올리기
        uses: actions/upload-artifact@v4
        with:
          name: gajirun-test-apk
          path: android-build/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: 받기 링크 갱신
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gajirun-test.apk
          gh release delete test-apk --yes --cleanup-tag || true
          sleep 3
          gh release create test-apk gajirun-test.apk --prerelease --target "$GITHUB_SHA" --title "가지런 시험용 앱 v$(cat .appver)" --notes "시험용 빌드입니다. 정식 출시 전 확인용이며 구글 플레이 버전과는 별개입니다."
