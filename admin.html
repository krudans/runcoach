<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>가지런 관리자</title>
<link rel="icon" href="gaji-icon.svg">
<style>
:root{--bg:#F4EFF8;--panel:#fff;--ink:#2A1638;--ink-2:#5E4A6E;--ink-3:#72637F;--line:#E6DDEF;--accent:#5B2D86;--soft:#F1ECF7;--ok:#0E9B72;--warn:#C2410C;--num:"Outfit",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Pretendard","Noto Sans KR",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.top h1{font-size:16px;margin:0;font-weight:900}.top h1 small{font-weight:700;color:var(--ink-3);margin-left:6px;font-size:12px}
.top .sp{flex:1}.who{font-size:12px;color:var(--ink-3)}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--accent)}.btn.sm{padding:5px 10px;font-size:12px}.btn.warn{background:#FDE7DC;color:var(--warn)}
.wrap{display:grid;grid-template-columns:200px 1fr;min-height:calc(100vh - 57px)}
nav{background:var(--panel);border-right:1px solid var(--line);padding:12px 8px}
nav button{display:flex;justify-content:space-between;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:10px;font-weight:800;color:var(--ink-2);cursor:pointer}
nav button.on{background:var(--soft);color:var(--accent)}nav button i{font-style:normal;font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px}
main{padding:20px 24px 60px;min-width:0}
h2{font-size:18px;margin:0 0 4px}.sub{color:var(--ink-3);font-size:12.5px;margin:0 0 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}.kpi i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-3);font-weight:700}.kpi b{display:block;font-family:var(--num);font-size:26px;font-weight:800;margin-top:2px}.kpi em{font-style:normal;font-size:11px;color:var(--ink-3)}
.meter{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;margin:6px 0 4px}.meter>i{display:block;height:100%;border-radius:999px;background:var(--accent)}.meter.w>i{background:#D97706}.meter.c>i{background:var(--warn)}
.lvl{font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;white-space:nowrap}.lvl.g{background:#E3F5EE;color:var(--ok)}.lvl.w{background:#FEF3C7;color:#92400E}.lvl.c{background:#FDE7DC;color:var(--warn)}
.dbg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.dbg .card{margin:0}.dbg b.big{font-family:var(--num);font-size:26px;font-weight:800}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.card h3{font-size:14px;margin:0 0 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bars div{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;margin:4px 0}.bars s{display:block;height:12px;border-radius:6px;background:var(--accent);text-decoration:none}.bars span{text-align:right;font-family:var(--num);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tools input,.tools select{border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--panel);min-width:130px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft);font-size:12px;color:var(--ink-2);white-space:nowrap;cursor:pointer}
tr.click{cursor:pointer}tr.click:hover td{background:#FBF9FD}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;white-space:nowrap;font-size:11px;font-weight:800;border-radius:6px;padding:1px 7px;background:var(--soft);color:var(--accent)}.tag.red{background:#FDE7DC;color:var(--warn)}.tag.green{background:#E3F5EE;color:var(--ok)}.tag.gray{background:#EEE;color:#777}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--panel);box-shadow:-10px 0 30px rgba(42,22,56,.15);z-index:20;overflow:auto;padding:18px 20px;transform:translateX(100%);transition:transform .2s}
.drawer.on{transform:none}.drawer h3{margin:0}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:13px;margin:10px 0}.kv i{font-style:normal;color:var(--ink-3)}
textarea,.fld{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}
label.f{display:block;font-size:12px;font-weight:800;color:var(--ink-2);margin:8px 0 3px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:24px;text-align:center;color:var(--ink-3)}
.gate{max-width:420px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;text-align:center}
.gate h1{font-size:20px;margin:6px 0}.gate p{color:var(--ink-3);font-size:13px}
.err{color:var(--warn);font-size:12.5px;margin-top:10px;white-space:pre-wrap;text-align:left}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;z-index:30;opacity:0;transition:opacity .2s}.toast.on{opacity:1}
.mini td,.mini th{padding:5px 8px;font-size:12px}
@media (max-width:760px){.wrap{grid-template-columns:1fr}nav{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}nav button{white-space:nowrap;width:auto}.grid2{grid-template-columns:1fr}main{padding:14px}table{display:block;overflow:auto}}
th.gs{cursor:pointer;user-select:none;white-space:nowrap}th.gs:hover{color:var(--accent)}th .arr{font-style:normal;font-size:10px;margin-left:4px;color:var(--accent)}
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin:12px 0 4px;flex-wrap:wrap}.pager button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer}.pager button.on{background:var(--ink);color:#fff;border-color:var(--ink)}.pager span{color:var(--ink-3)}
table.kv2 td.big{font-size:18px;font-weight:800}table.kv2 td.sub{color:var(--ink-3);font-size:12px}table.dist td:last-child{width:40%}table.dist s{display:block;height:8px;border-radius:4px;background:var(--accent);text-decoration:none;opacity:.7}
.rg-head .row{gap:10px}.rg-toc{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.rg-toc button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;color:var(--ink-2);cursor:pointer}.rg-toc button:hover{color:var(--accent);border-color:var(--accent)}
.rg-sec{scroll-margin-top:70px}.rg-sec h3 small{font-weight:400;color:var(--ink-3);font-size:12px;margin-left:6px}.rg-blk h4{font-size:13px;margin:14px 0 6px;color:var(--accent)}.rg-blk:first-of-type h4{margin-top:4px}
table.rg td:first-child{width:22%;font-weight:700;color:var(--ink)}table.rg td:nth-child(2){color:var(--ink-2);line-height:1.6}table.rg td:last-child{width:20%}.rg-src{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}table.rg th{cursor:default}
</style>
</head>
<body>
<div id="gate" class="gate">
  <img src="gaji-icon.svg" width="56" height="56" alt="">
  <h1>가지런 관리자</h1>
  <p>관리자로 등록된 구글 계정만 들어올 수 있어요.<br><span style="font-size:12px">들어올 때마다 구글 로그인을 다시 거치고, 12시간이 지나거나 창을 닫으면 다시 로그인해요.</span></p>
  <button class="btn" id="login">구글 계정으로 로그인</button>
  <div class="err" id="gateErr"></div>
</div>
<div id="app" hidden>
  <div class="top"><h1>가지런 관리자<small>실시간 코칭 프로그램</small></h1><span class="sp"></span><span class="who" id="who"></span><button class="btn ghost sm" id="reload">새로 불러오기</button><button class="btn ghost sm" id="logout">로그아웃</button></div>
  <div class="wrap">
    <nav id="nav">
      <button data-tab="dash" class="on">대시보드</button>
      <button data-tab="inst">사용자 목록</button>
      <button data-tab="users">클라우드 회원</button>
      <button data-tab="plans">목표·일정</button>
      <button data-tab="races">대회 목록</button>
      <button data-tab="notices">공지·알림</button>
      <button data-tab="rules">앱 규정</button>
      <button data-tab="admins">관리자</button>
      <button data-tab="db">DB 상태 <i id="dbN" hidden>!</i></button>
      <button data-tab="fb">피드백·문의 <i id="fbN" hidden></i></button>
    </nav>
    <main id="main"><div class="empty">불러오는 중…</div></main>
  </div>
</div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ═══ 가지런 관리자 ═══
   · 들어오기: 구글 로그인 + 관리자 이메일 목록. 진짜 잠금은 Firestore 보안 규칙(isAdmin)이 한다 — 이 화면의 검사는 안내용.
   · 회원 데이터는 보기만. 손대는 건 관리자 전용 문서(admin_users/{uid}: 정지·메모)뿐 — 회원의 기록·일정은 바꾸지 않는다.
   · 공지(notices)·대회 추가/숨김(catalog/races)·피드백(feedback)은 관리자 전용 컬렉션. */
const OWNER='krudans@gmail.com';          // 관리자를 추가·해제할 수 있는 단 한 사람
const FRESH_H=12;                        // 로그인 후 이 시간이 지나면 다시 로그인
firebase.initializeApp({apiKey:"AIzaSyDlSwvduhTI3Locdls_wYFn70OtTkPoK8g",authDomain:"runcoach-120ff.firebaseapp.com",projectId:"runcoach-120ff",storageBucket:"runcoach-120ff.firebasestorage.app"});
const auth=firebase.auth(), db=firebase.firestore();
const $=id=>document.getElementById(id);
const ESC=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D=x=>{ if(!x)return '—'; const d=x.toDate?x.toDate():new Date(x); if(isNaN(d))return '—'; const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago=ms=>{ if(!ms)return '—'; const m=(Date.now()-ms)/6e4; return m<60?Math.round(m)+'분 전':m<1440?Math.round(m/60)+'시간 전':Math.round(m/1440)+'일 전'; };
const clock=s=>{ if(!s)return '—'; s=Math.round(s); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(c).padStart(2,'0'); };
const DIST=m=>!m?'':m>=42000?'풀코스':m>=21000?'하프':(m/1000)+'km';
const KIND={race:'대회 기록',finish:'완주',aero:'편한 달리기',custom:'직접 짠 계획',start:'30분 달리기',weight:'체중',health:'건강',back:'복귀'};
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>e.classList.remove('on'),2200); }
let S={inst:[],users:[],adm:{},notices:[],fb:[],cat:{add:[],hide:[]},racesJson:null,tab:'dash',q:'',sort:'upd',sortI:'last',rf:{y:'',m:'',reg:'',a:'',st:'',c:'',sort:'date'}};

/* ── 로그인 ── */
const GP=()=>{ const g=new firebase.auth.GoogleAuthProvider(); g.setCustomParameters({prompt:'select_account',login_hint:OWNER}); return g; };
auth.setPersistence(firebase.auth.Auth.Persistence.SESSION).catch(()=>{});
$('login').onclick=async()=>{ $('gateErr').textContent=''; try{ await auth.signInWithPopup(GP()); }catch(e){ if(/popup/i.test(e.code||'')){ await auth.signInWithRedirect(GP()); } else $('gateErr').textContent='로그인하지 못했어요: '+(e.message||e); } };
$('logout').onclick=()=>auth.signOut();
$('reload').onclick=()=>loadAll();
auth.getRedirectResult().catch(()=>{});
auth.onAuthStateChanged(async u=>{
  if(!u){ $('gate').hidden=false; $('app').hidden=true; return; }
  const em=(u.email||'').toLowerCase();
  const tk=await u.getIdTokenResult().catch(()=>null); const at=tk&&tk.claims.auth_time?tk.claims.auth_time*1000:0;
  if(!at||Date.now()-at>FRESH_H*36e5){ $('gateErr').textContent='로그인한 지 오래돼서 다시 확인이 필요해요. 다시 로그인해 주세요.'; await auth.signOut(); return; }
  let ok=u.emailVerified&&em===OWNER;
  if(!ok&&u.emailVerified){ try{ ok=(await db.collection('admins').doc(em).get()).exists; }catch(e){ ok=false; } }
  if(!ok){ $('gateErr').textContent=`${u.email} 은 관리자로 등록되지 않은 계정이에요.`; await auth.signOut(); return; }
  S.me=em; S.isOwner=em===OWNER; clearTimeout(S._exp); S._exp=setTimeout(()=>{ toast('로그인 12시간이 지나 다시 로그인해요'); auth.signOut(); },Math.max(0,at+FRESH_H*36e5-Date.now()));
  $('gate').hidden=true; $('app').hidden=false; $('who').textContent=u.email; loadAll();
});

const KEEP_DAYS=365;
async function autoClean(){ const cut=Date.now()-KEEP_DAYS*864e5, out={inst:0,fb:0,at:Date.now()};
  const old=S.inst.filter(x=>{ const t=msOf(x.last)||msOf(x.first); return t&&t<cut; }).slice(0,200);
  if(old.length){ const b=db.batch(); old.forEach(x=>b.delete(db.collection('installs').doc(x.id))); await b.commit();
    const ids=new Set(old.map(x=>x.id)); S.inst=S.inst.filter(x=>!ids.has(x.id)); out.inst=old.length; }
  const fq=await db.collection('feedback').where('at','<',new Date(cut)).limit(200).get();
  if(fq.size){ const b=db.batch(); fq.forEach(d=>b.delete(d.ref)); await b.commit(); const ids=new Set(fq.docs.map(d=>d.id)); S.fb=S.fb.filter(x=>!ids.has(x.id)); out.fb=fq.size; }
  return out; }
/* ── 불러오기 ── */
async function loadAll(){
  $('main').innerHTML='<div class="empty">불러오는 중…</div>';
  const errs=[];
  const get=async(name,fn)=>{ try{ return await fn(); }catch(e){ errs.push(`${name}: ${e.code||e.message||e}`); return null; } };
  const us=await get('회원(users)',()=>db.collection('users').get());
  /* 앱은 '배열 안의 배열'이 든 칸을 {__j:'글자'}로 올린다 — 되돌려서 읽는다 */
  const unJ=o=>{ const c={}; for(const k in o){ const v=o[k]; c[k]=v&&typeof v==='object'&&!Array.isArray(v)&&typeof v.__j==='string'?(()=>{ try{ return JSON.parse(v.__j); }catch(e){ return null; } })():v; } return c; };
  S.users=us?us.docs.map(d=>Object.assign({uid:d.id},unJ(d.data()))):[];
  const ins=await get('사용자(installs)',()=>db.collection('installs').get());
  S.inst=ins?ins.docs.map(d=>Object.assign({id:d.id},d.data())):[];
  const nk=await get('별명(nicks)',()=>db.collection('nicks').get());
  S.nicks=nk?nk.docs.map(d=>Object.assign({id:d.id},d.data())):[];
  const am=await get('관리자(admins)',()=>db.collection('admins').get());
  S.admins=am?am.docs.map(d=>Object.assign({id:d.id},d.data())):[];
  const ad=await get('정지·메모(admin_users)',()=>db.collection('admin_users').get());
  S.adm={}; if(ad)ad.forEach(d=>S.adm[d.id]=d.data());
  const no=await get('공지(notices)',()=>db.collection('notices').orderBy('at','desc').get());
  S.notices=no?no.docs.map(d=>Object.assign({id:d.id},d.data())):[];
  const fb=await get('피드백(feedback)',()=>db.collection('feedback').orderBy('at','desc').limit(500).get());
  S.fb=fb?fb.docs.map(d=>Object.assign({id:d.id},d.data())):[];
  const bn=await get('배너(catalog/banner)',()=>db.collection('catalog').doc('banner').get());
  S.banner=bn&&bn.exists?bn.data():{};
  const ct=await get('대회 추가·숨김(catalog)',()=>db.collection('catalog').doc('races').get());
  S.cat=Object.assign({add:[],hide:[]},ct&&ct.exists?ct.data():{});
  try{ const r=await fetch('races.json',{cache:'no-store'}); S.racesJson=r.ok?await r.json():null; }catch(e){ S.racesJson=null; }
  try{ const r=await fetch('index.html?_='+Date.now(),{cache:'no-store'}); const t=await r.text(); const m=t.match(/const APPVER='([^']+)'/); S.appVer=m?m[1]:null; }catch(e){ S.appVer=null; }
  /* 자동 삭제 — 처리방침에 적은 보관 기간(1년)이 지난 것. 무료 요금제엔 자동 만료(TTL)가 없어, 관리자 페이지를 열 때 지운다 */
  try{ S.cleaned=await autoClean(); }catch(e){ S.cleaned={err:String(e.message||e)}; }
  S.errs=errs; const nNew=S.fb.filter(x=>!x.done).length; $('fbN').hidden=!nNew; $('fbN').textContent=nNew;
  render();
}

/* ── 회원 한 명 요약 — 앱이 올린 설정 문서에서 ── */
function U(u){
  const g=(u.plan&&u.plan.goal)||u.goal||{}, st=u.stat||{}, a=S.adm[u.uid]||{};
  const ses=(u.plan&&u.plan.sessions)||[];
  const wk={}; ses.forEach(x=>{ if(x.type==='off')return; const d=new Date(x.d.slice(0,10)+'T00:00:00'); const m=new Date(d); m.setDate(d.getDate()-((d.getDay()+6)%7)); const k=m.toISOString().slice(0,10); wk[k]=(wk[k]||0)+(+x.dist||0); });
  const dd=g.date?Math.ceil((new Date(g.date.slice(0,10)+'T00:00:00')-new Date(new Date().toDateString()))/864e5):null;
  return {uid:u.uid,email:u.email||'(이메일 없음)',upd:+u.updatedAt||0,ver:u.appVer||'—',g,goal:g.kind?`${KIND[g.kind]||g.kind}${g.m?' · '+DIST(g.m):''}${g.sec||g.final?' '+clock(g.final||g.sec):''}`:'목표 없음',date:g.date?g.date.slice(0,10):'',dd,
    runs:st.runs!=null?st.runs:null,km:st.km!=null?st.km:null,last:st.lastRun||'',w7:st.km7!=null?st.km7:null,wk:st.kmWk!=null?st.kmWk:null,mile:st.mile!=null?st.mile:((S.inst.find(i=>i.uid===u.uid&&i.mile!=null)||{}).mile??null),days:(u.plan&&u.plan.days||[]).join(''),wkKm:Object.keys(wk).sort().map(k=>Math.round(wk[k])),
    planStart:u.plan&&u.plan.start||'',race:u.prof&&u.prof.race,susp:!!a.suspended,memo:a.memo||'',raw:u};
}

    if(typeof x==='number'&&typeof y==='number')return (x-y)*st.dir; return String(x).localeCompare(String(y),'ko')*st.dir; }); }
  const pages=Math.max(1,Math.ceil(L.length/per)); if(st.page>pages)st.page=pages; const P=L.slice((st.page-1)*per,st.page*per);
  const th=cols.map(c=>`<th class="${c.num?'num ':''}${c.nosort?'':'gs'}"${c.nosort?'':` data-gs="${id}:${c.k}"`}>${c.h}${st.sort===c.k?`<i class="arr">${st.dir>0?'▲':'▼'}</i>`:''}</th>`).join('');
  const body=P.map(x=>`<tr${opt.row?opt.row(x):''}>${cols.map(c=>`<td${c.num?' class="num"':''}${c.style?` style="${c.style}"`:''}>${c.v(x)}</td>`).join('')}</tr>`).join('');

  return `<div class="tools">${opt.search?`<input data-gq="${id}" placeholder="${ESC(opt.ph||'검색')}" value="${ESC(st.q)}">`:''}${opt.tools||''}<span class="who">${L.length}${opt.unit||'개'}${rows.length!==L.length?` / 전체 ${rows.length}`:''}${pages>1?` · ${st.page}/${pages}쪽`:''}</span></div>
    ${L.length?`<table>${th?`<tr>${th}</tr>`:''}${body}</table>${pager}`:`<div class="card empty">${opt.empty||'없음'}</div>`}`; }

function instMerged(){ const ms=x=>x&&x.toDate?x.toDate().getTime():(x?Date.parse(x):0); const by={}, out=[];
  S.inst.forEach(x=>{ const k=x.uid||x.email; if(!k){ out.push(Object.assign({devs:[x.plat||'기타'],n:1},x)); return; }
    const m=by[k]; if(!m){ by[k]=Object.assign({devs:[x.plat||'기타'],n:1},x); out.push(by[k]); return; }
    m.n++; m.devs.push(x.plat||'기타');
    if(ms(x.last)>ms(m.last)){ m.last=x.last; m.ver=x.ver; m.plat=x.plat; m.goal=x.goal; m.gm=x.gm; m.gdate=x.gdate; m.id=x.id; m.syncErr=x.syncErr; }
    if(ms(x.first)&&(!ms(m.first)||ms(x.first)<ms(m.first)))m.first=x.first;
    m.pwa=m.pwa||x.pwa; m.onb=m.onb||x.onb; m.runs=Math.max(m.runs||0,x.runs||0); m.km=Math.max(m.km||0,x.km||0); m.mile=(m.mile==null&&x.mile==null)?null:Math.max(m.mile||0,x.mile||0);
    ['nick','by','sex','consent','email','uid'].forEach(f=>{ if(!m[f]&&x[f])m[f]=x[f]; }); });

/* ══ DB 상태 — 무료 한도(Spark) 안에서 운영하기 위한 화면 ══

   이 화면을 연다고 한도가 크게 줄지 않게, 문서 수 세기는 버튼을 눌렀을 때만 한다 */
const FREE={read:50000,write:20000,del:20000,gib:1};
const DBEST={run:35*1024,user:20*1024,inst:600,other:1024};   /* 문서 1개 평균 크기 추정(바이트) */
const PROJ='runcoach-120ff';
function ptDayStart(d){ /* 태평양 시간 자정(UTC ms) */
  const f=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
  const p=Object.fromEntries(f.formatToParts(d).filter(x=>x.type!=='literal').map(x=>[x.type,+x.value]));
  const asUTC=Date.UTC(p.year,p.month-1,p.day,p.hour%24,p.minute,p.second); const off=asUTC-d.getTime();
  return Date.UTC(p.year,p.month-1,p.day)-off; }
const lvl=r=>r==null?null:r>=0.9?'c':r>=0.7?'w':'g';
const LVLT={g:'여유',w:'주의',c:'위험'};

  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>${name}</b>${L?`<span class="lvl ${L}">${LVLT[L]}</span>`:''}</div>
    <div style="margin-top:4px"><b class="big">${used==null?'—':Math.round(used).toLocaleString()}</b> <span class="sub">/ ${limit.toLocaleString()} ${unit}</span></div>
    <div class="meter ${L==='w'?'w':L==='c'?'c':''}"><i style="width:${r==null?0:Math.min(100,r*100).toFixed(1)}%"></i></div>
    <div class="sub">${r==null?note:`무료 한도의 ${(r*100).toFixed(r<0.1?1:0)}% · ${note}`}</div></div>`; }
async function monFetch(metric,startMs,endMs){
  const q=new URLSearchParams({filter:`metric.type="${metric}"`,'interval.startTime':new Date(startMs).toISOString(),'interval.endTime':new Date(endMs).toISOString(),
    'aggregation.alignmentPeriod':'3600s','aggregation.perSeriesAligner':'ALIGN_SUM','aggregation.crossSeriesReducer':'REDUCE_SUM'});
  const r=await fetch(`https://monitoring.googleapis.com/v3/projects/${PROJ}/timeSeries?${q}`,{headers:{Authorization:'Bearer '+S.monTok}});
  if(!r.ok){ const t=await r.text().catch(()=>''); const e=new Error(r.status+' '+t.slice(0,300)); e.status=r.status; throw e; }
  const j=await r.json(); const pts=[]; (j.timeSeries||[]).forEach(ts=>(ts.points||[]).forEach(p=>pts.push({t:Date.parse(p.interval.endTime),v:+(p.value.int64Value||p.value.doubleValue||0)}))); return pts; }
async function monLoad(){
  const now=Date.now(), d0=ptDayStart(new Date()), start=d0-6*864e5;
  const pick=async(names)=>{ let last; for(const n of names){ try{ const p=await monFetch(n,start,now); if(p.length||n===names[names.length-1])return p; }catch(e){ last=e; if(e.status===401||e.status===403)throw e; } } if(last)throw last; return []; };
  const [rd,wr,dl]=await Promise.all([
    pick(['firestore.googleapis.com/document/read_ops_count','firestore.googleapis.com/document/read_count']),
    pick(['firestore.googleapis.com/document/write_ops_count','firestore.googleapis.com/document/write_count']),
    pick(['firestore.googleapis.com/document/delete_ops_count','firestore.googleapis.com/document/delete_count'])]);
  const days=[...Array(7)].map((_,i)=>d0-(6-i)*864e5);
  const byDay=pts=>days.map(ds=>pts.filter(p=>p.t>ds&&p.t<=ds+864e5).reduce((a,p)=>a+p.v,0));
  S.mon={at:now,days,read:byDay(rd),write:byDay(wr),del:byDay(dl)}; }

  try{ const p=new firebase.auth.GoogleAuthProvider(); p.addScope('https://www.googleapis.com/auth/monitoring.read'); p.setCustomParameters({login_hint:S.me});
    const res=await auth.currentUser.reauthenticateWithPopup(p); const tok=res&&res.credential&&res.credential.accessToken;
    if(!tok)throw new Error('허락 정보를 받지 못했어요');
    S.monTok=tok; S.monTokAt=Date.now(); S.monErr=null; await monLoad(); }
  catch(e){ S.monErr=e.status===403?'Cloud Monitoring API가 꺼져 있거나 권한이 없어요. 아래 \'처음 한 번 설정\'을 따라 켜 주세요.':(e.status===401?'허락이 만료됐어요. 다시 연결해 주세요.':'불러오지 못했어요: '+(e.message||e)); }
  render(); }

      if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,160)); const j=await r.json(); const a=j[0]&&j[0].result&&j[0].result.aggregateFields; return +(a&&a.n&&a.n.integerValue||0); };

function plans(){ const C=S.users.map(U).filter(x=>x.g.kind); C.forEach(x=>x.src='cloud');
  /* 클라우드에 올리지 않은 회원도 보이게 — 앱이 보내는 사용 현황(installs)의 목표로 채운다. 같은 계정은 클라우드 쪽을 쓴다 */
  const seen=new Set(); C.forEach(x=>{ seen.add(x.uid); if(x.email)seen.add(x.email.toLowerCase()); });
  const today=new Date(new Date().toDateString());
  const D2=instMerged().filter(x=>x.goal&&!seen.has(x.uid)&&!seen.has((x.email||'').toLowerCase())).map(x=>({src:'dev',uid:'',
    email:x.nick?x.nick+(x.email?' ('+x.email+')':''):(x.email||'기기 '+String(x.id||'').slice(0,8)),
    goal:`${KIND[x.goal]||x.goal}${x.gm?' · '+DIST(x.gm):''}`,date:x.gdate||'',dd:x.gdate?Math.ceil((new Date(x.gdate+'T00:00:00')-today)/864e5):null,days:'',planStart:'',wkKm:[],race:null}));
  const L=C.concat(D2);
  const cols=[{k:'email',h:'회원',v:x=>ESC(x.email)+(x.src==='dev'?' <span class="tag gray">기기 정보</span>':''),s:x=>x.email},{k:'goal',h:'목표',v:x=>ESC(x.goal),s:x=>x.goal},{k:'date',h:'대회일',num:1,v:x=>x.date||'—',s:x=>x.date||''},{k:'dd',h:'D-day',num:1,v:x=>x.dd!=null?(x.dd>=0?'D-'+x.dd:'지남'):'—',s:x=>x.dd??null},{k:'days',h:'뛰는 요일',v:x=>ESC(x.days)||'—',s:x=>x.days},{k:'ps',h:'일정 시작',num:1,v:x=>x.planStart||'—',s:x=>x.planStart||''},{k:'wk',h:'4주 주간 거리',num:1,v:x=>x.wkKm.join(' → ')||'—',s:x=>x.wkKm.reduce((a,b)=>a+b,0)},{k:'race',h:'기준 기록',num:1,v:x=>x.race&&x.race.sec?DIST(x.race.m)+' '+clock(x.race.sec):'—',s:x=>x.race&&x.race.sec?x.race.sec/(x.race.m||1):null}];
  return `<h2>목표·일정</h2><p class="sub">회원이 정한 목표와 지금 4주 일정의 주간 거리. 클라우드 회원은 행을 누르면 일정 전체를 볼 수 있어요. '기기 정보'는 클라우드에 올리지 않은 사람이라 목표와 대회일만 있어요.</p>
  ${grid('plans',cols,L,{sort:'dd',per:50,unit:'명',ph:'회원·목표 검색',search:x=>x.email+' '+x.goal,row:x=>x.uid?` class="click" data-uid="${x.uid}"`:'',empty:'목표를 정한 회원이 없어요'})}`; }

function races(){ const R=(S.racesJson&&S.racesJson.races)||[], hide=new Set(S.cat.hide||[]), today=new Date().toISOString().slice(0,10);
  const fut=R.filter(r=>r.date>=today), F=S.rf, CAP=['서울','경기','인천'];
  const years=[...new Set(fut.map(r=>r.date.slice(0,4)))].sort();
  const months=F.y?[...new Set(fut.filter(r=>r.date.slice(0,4)===F.y).map(r=>+r.date.slice(5,7)))].sort((a,b)=>a-b):[];

  const ac=[{k:'date',h:'날짜',num:1,v:r=>r.date,s:r=>r.date},{k:'name',h:'이름',v:r=>ESC(r.name),s:r=>r.name},{k:'courses',h:'종목',v:r=>ESC((r.courses||[]).join(', ')),s:r=>(r.courses||[]).join(',')},{k:'place',h:'장소',v:r=>ESC(r.place||''),s:r=>r.place||''},{k:'act',h:'',nosort:1,v:r=>`<button class="btn warn sm" data-rdel="${r._i}">빼기</button>`}];
  return `<h2>대회 목록</h2><p class="sub">앱의 대회 목록 = 매일 자동으로 받는 마라톤온라인 일정(${fut.length}개) + 여기서 추가한 대회 − 숨긴 대회. 바꾸면 앱에 바로 반영돼요.</p>
  <div class="card"><h3>대회 추가</h3><div class="grid2">
    <div><label class="f">대회 이름</label><input class="fld" id="rN" placeholder="예: 2027 대구마라톤"></div>
    <div><label class="f">날짜</label><input class="fld" id="rD" type="date"></div>
    <div><label class="f">종목 (쉼표로)</label><input class="fld" id="rC" placeholder="풀, 하프, 10km"></div>
    <div><label class="f">장소</label><input class="fld" id="rP" placeholder="대구 국채보상공원"></div>
    <div><label class="f">지역</label><input class="fld" id="rA" placeholder="대구"></div>
    <div><label class="f">홈페이지</label><input class="fld" id="rH" placeholder="https://"></div></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="rAdd">추가</button></div></div>
  <div class="card"><h3>추가한 대회 (${(S.cat.add||[]).length})</h3>${grid('radd',ac,(S.cat.add||[]).map((r,i)=>Object.assign({_i:i},r)),{sort:'date',per:50,empty:'없음'})}</div>
  <div class="card"><h3>자동 목록 (숨김 ${hide.size}개)</h3>
    ${grid('races',rc,L,{sort:'date',per:50,ph:'이름·장소로 찾기',search:r=>r.name+' '+(r.place||'')+' '+(r.area||''),tools:`${sel('y',years.map(y=>[y,y+'년']),F.y,'연도 전체')}${F.y?sel('m',months.map(m=>[m,m+'월']),F.m,F.y+' 전체'):''}${sel('reg',[['cap','수도권'],['oth','지방']],F.reg,'전국')}${sel('a',areas.map(a=>[a,a]),F.a,F.reg==='cap'?'수도권 전체':F.reg==='oth'?'지방 전체':'모든 지역')}${sel('st',[['open','접수중'],['closed','접수 마감']],F.st,'접수 전체')}${sel('c',[['풀','풀코스'],['하프','하프'],['10km','10km'],['5km','5km']],F.c,'종목 전체')}`,empty:'해당 대회 없음'})}</div>`; }

function vers(embed){ const M=instMerged(), cur=S.appVer||'—';
  const vcount={}; M.forEach(x=>{ const v=x.ver||'모름'; const o=vcount[v]||(vcount[v]={v,n:0,last:0}); o.n++; o.last=Math.max(o.last,msOf(x.last)); });

  const vc=[{k:'v',h:'버전',num:1,v:x=>(x.v===cur?'<span class="tag green">최신</span> ':'')+ESC(x.v),s:x=>vn(x.v)},{k:'n',h:'사용자',num:1,v:x=>x.n,s:x=>x.n},{k:'p',h:'비율',num:1,v:x=>(M.length?Math.round(x.n/M.length*100):0)+'%',s:x=>x.n},{k:'last',h:'마지막으로 쓴 때',num:1,v:x=>x.last?ago(x.last):'—',s:x=>x.last}];
  const CL=CHANGELOG.map((r,i)=>({i,d:r[0],v:r[1],k:r[2],t:r[3]}));
  const cc=[{k:'d',h:'날짜',num:1,v:x=>x.d,s:x=>x.d+String(9999-x.i).padStart(4,'0')},{k:'v',h:'버전',num:1,v:x=>x.v?ESC(x.v):'—',s:x=>vn(x.v)},{k:'k',h:'구분',v:x=>`<span class="tag ${x.k==='앱'?'':x.k==='관리자'?'green':'gray'}">${ESC(x.k)}</span>`,s:x=>x.k},{k:'t',h:'바뀐 내용',style:'max-width:720px',v:x=>ESC(x.t),s:x=>x.t}];
  const old=M.filter(x=>x.ver&&x.ver!==cur&&cur!=='—').length;
  return `${embed?'<p class="sub">':'<h2>앱 버전</h2><p class="sub">'}지금 배포된 앱 버전과 사용자들이 쓰는 버전, 그리고 지금까지 바뀐 내용 전체예요. 앱은 새로 열면 최신으로 바뀌어요.</p>

    <div class="card"><h3>사용자 버전 분포</h3>${grid('vdist',vc,VR,{sort:'v',dir:-1,per:20,empty:'집계 없음'})}</div></div>
  <div class="card"><h3>변경 기록 (날짜순)</h3><p class="sub">'번호 그대로'는 버전 번호를 올리지 않고 고친 묶음이에요.</p>
    ${grid('clog',cc,CL,{sort:'d',dir:-1,per:30,ph:'버전·내용 검색',search:x=>x.v+' '+x.k+' '+x.t,empty:'기록 없음'})}</div>`; }
function bannerCard(){ const b=S.banner||{}, t=new Date().toISOString().slice(0,10), live=b.active&&b.title&&b.url&&(!b.from||b.from<=t)&&(!b.to||b.to>=t);

const GRC={A:'green',B:'',C:'gray','D':'',결정:'red'};
function gradeTag(g){ if(!g)return ''; const k=g.split(/[ ·]/)[0]; return `<span class="tag ${GRC[k]!==undefined?GRC[k]:'gray'}">${ESC(k)}</span>${g.length>k.length?`<span class="rg-src">${ESC(g.slice(k.length).replace(/^[ ·]+/,''))}</span>`:''}`; }
function regDoc(){ const n=REG.reduce((a,x)=>a+x.b.reduce((b,y)=>b+y.r.length,0),0);
  return `<div class="card rg-head"><div class="row"><b>기준 v${REG_VER.v} · ${REG_VER.d}</b><span class="sub" style="margin:0">${REG.length}개 영역 · ${n}개 항목 · 근거 등급 <span class="tag green">A</span> 메타·RCT <span class="tag">B</span> 단일 연구 <span class="tag gray">C</span> 코칭 관행 <span class="tag">D</span> 내 기록 <span class="tag red">결정</span> 운영자 결정</span></div>
    <input class="fld" id="regQ" placeholder="찾기 — 예: 템포, Z2, 테이퍼, Riegel" style="margin-top:10px">
    <div class="rg-toc">${REG.map(x=>`<button type="button" data-rgo="${x.id}">${ESC(x.t)}</button>`).join('')}</div></div>
  ${REG.map(x=>`<div class="card rg-sec" id="rg-${x.id}"><h3>${ESC(x.t)} <small>${ESC(x.d)}</small></h3>${x.b.map(bl=>`<div class="rg-blk"><h4>${ESC(bl.h)}</h4><table class="mini rg"><tr><th>항목</th><th>규정</th><th>근거</th></tr>${bl.r.map(r=>`<tr data-q="${ESC((x.t+' '+bl.h+' '+r.join(' ')).toLowerCase())}"><td>${ESC(r[0])}</td><td>${ESC(r[1])}</td><td>${gradeTag(r[2])}</td></tr>`).join('')}</table></div>`).join('')}</div>`).join('')}
  <p class="rg-empty sub" hidden>찾는 내용이 없어요</p>`; }
function rules(){ const sub=S.rtab||'ver';
  return `<h2>앱 규정</h2><p class="sub">앱 버전 기록과, 앱이 따르는 모든 지침·근거·고려사항. 앱의 규칙을 바꾸면 같은 배포에서 이 표도 함께 고쳐요.</p>

  ${sub==='ver'?vers(true):regDoc()}`; }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-rtab]'); if(t){ S.rtab=t.dataset.rtab; render(); return; }

document.addEventListener('input',e=>{ if(e.target.id!=='regQ')return; const q=e.target.value.trim().toLowerCase(); let any=0;
  document.querySelectorAll('.rg-sec').forEach(sec=>{ let sn=0; sec.querySelectorAll('.rg-blk').forEach(bl=>{ let bn=0; bl.querySelectorAll('tr[data-q]').forEach(tr=>{ const ok=!q||tr.dataset.q.includes(q); tr.hidden=!ok; if(ok)bn++; }); bl.hidden=!bn; sn+=bn; }); sec.hidden=!sn; any+=sn; });
  const em=document.querySelector('.rg-empty'); if(em)em.hidden=!!any; });

  const mg=$('monGo'); if(mg)mg.onclick=()=>monConnect();
  const mr=$('monRe'); if(mr)mr.onclick=async()=>{ try{ await monLoad(); S.monErr=null; }catch(e){ S.monErr='불러오지 못했어요: '+(e.message||e); if(e.status===401)S.monTok=null; } render(); };
  const dc=$('dbCnt'); if(dc)dc.onclick=()=>dbCount();
  const aa=$('admAdd'); if(aa)aa.onclick=async()=>{ const em=($('admNew').value||'').trim().toLowerCase(); $('admErr').textContent='';
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ $('admErr').textContent='구글 계정 주소를 정확히 넣어 주세요.'; return; }
    if(em===OWNER||(S.admins||[]).some(x=>x.id===em)){ $('admErr').textContent='이미 관리자예요.'; return; }
    if(!confirm(`${em} 을(를) 관리자로 추가할까요?\n이 사람은 회원 정보·공지·대회 목록을 볼 수 있고 바꿀 수 있어요.`))return;
    try{ const d={by:S.me,at:firebase.firestore.FieldValue.serverTimestamp()}; await db.collection('admins').doc(em).set(d); S.admins=(S.admins||[]).concat([{id:em,by:S.me,at:new Date()}]); toast('관리자로 추가했어요'); render(); }
    catch(err){ $('admErr').textContent='추가하지 못했어요: '+(err.code==='permission-denied'?'Firebase 규칙이 아직 새 것으로 게시되지 않았어요.':(err.message||err)); } };
  document.querySelectorAll('[data-admdel]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.admdel; if(!confirm(`${id} 의 관리자 권한을 해제할까요?`))return;
    try{ await db.collection('admins').doc(id).delete(); S.admins=S.admins.filter(x=>x.id!==id); toast('해제했어요'); render(); }catch(err){ alert('해제하지 못했어요: '+(err.message||err)); } });
  document.querySelectorAll('[data-nickdel]').forEach(b=>b.onclick=async e=>{ e.stopPropagation(); const id=b.dataset.nickdel; if(!confirm(`별명 "${id}" 예약을 풀까요?\n다른 사람이 이 별명을 쓸 수 있게 됩니다.`))return; try{ await db.collection('nicks').doc(id).delete(); S.nicks=S.nicks.filter(x=>x.id!==id); render(); }catch(err){ alert('실패: '+(err.message||err)); } });
  const ci=$('csvI'); if(ci)ci.onclick=()=>{ const rows=[['기기ID','이메일','별명','출생연도','성별','동의일','기기','앱설치','처음','마지막','버전','목표','대회일','기록수','앱누적km','러닝마일리지']].concat(S.inst.map(x=>[x.id,x.email||'',x.nick||'',x.by||'',x.sex||'',x.consent?D(x.consent):'',x.plat||'',x.pwa?'Y':'',D(x.first),D(x.last),x.ver||'',x.goal||'',x.gdate||'',x.runs??'',x.km??'',x.mile??'']));
    const t='\ufeff'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'})); a.download=`gajirun_users_${new Date().toISOString().slice(0,10)}.csv`; a.click(); };
  const csv=$('csv'); if(csv)csv.onclick=()=>{ const L=S.users.map(U); const rows=[['email','uid','상태','마지막동기화','목표','대회일','기록수','누적km','최근7일km','버전','메모']].concat(L.map(x=>[x.email,x.uid,x.susp?'정지':'정상',x.upd?D(x.upd):'',x.goal,x.date,x.runs??'',x.km!=null?Math.round(x.km):'',x.w7!=null?Math.round(x.w7):'',x.ver,x.memo]));
    const t='﻿'+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'})); a.download=`gajirun_members_${new Date().toISOString().slice(0,10)}.csv`; a.click(); };
  /* 대회 */
  const saveCat=async()=>{ await db.collection('catalog').doc('races').set({add:S.cat.add||[],hide:S.cat.hide||[],at:firebase.firestore.FieldValue.serverTimestamp()}); };
  const ra=$('rAdd'); if(ra)ra.onclick=async()=>{ const n=$('rN').value.trim(), d=$('rD').value; if(!n||!d)return alert('이름과 날짜는 꼭 넣어 주세요');
    const r={id:'adm-'+d.replace(/-/g,'')+'-'+Date.now().toString(36),date:d,name:n,courses:$('rC').value.split(',').map(s=>s.trim()).filter(Boolean),place:$('rP').value.trim(),area:$('rA').value.trim(),home:$('rH').value.trim()||null,admin:true};
    S.cat.add=(S.cat.add||[]).concat([r]).sort((a,b)=>a.date.localeCompare(b.date)); try{ await saveCat(); toast('대회를 추가했어요'); render(); }catch(e){ alert('저장하지 못했어요: '+(e.code||e.message)); } };
  document.querySelectorAll('[data-rdel]').forEach(b=>b.onclick=async()=>{ if(!confirm('이 대회를 목록에서 뺄까요?'))return; S.cat.add.splice(+b.dataset.rdel,1); try{ await saveCat(); render(); }catch(e){ alert(e.code||e.message); } });
  document.querySelectorAll('[data-rhide]').forEach(b=>b.onclick=async()=>{ S.cat.hide=[...new Set((S.cat.hide||[]).concat([b.dataset.rhide]))]; try{ await saveCat(); toast('숨겼어요'); render(); }catch(e){ alert(e.code||e.message); } });
  document.querySelectorAll('[data-rshow]').forEach(b=>b.onclick=async()=>{ S.cat.hide=(S.cat.hide||[]).filter(x=>x!==b.dataset.rshow); try{ await saveCat(); render(); }catch(e){ alert(e.code||e.message); } });
  /* 공지 */
  const bs=$('bSave'); if(bs)bs.onclick=async()=>{ const title=$('bT').value.trim(), url=$('bU').value.trim(), from=$('bF').value||null, to=$('bE').value||null, active=$('bA').checked;
    if(active&&(!title||!/^https?:\/\//.test(url)))return alert('제목과 https:// 링크를 넣어 주세요'); if(from&&to&&from>to)return alert('종료일이 시작일보다 앞이에요');
    try{ const o={title,url,from,to,active,updatedAt:new Date().toISOString()}; await db.collection('catalog').doc('banner').set(o); S.banner=o; render(); alert(active?'배너 게시됨 — 앱은 다음에 열 때 반영':'배너 저장됨(꺼짐)'); }catch(e){ alert('실패: '+(e.message||e)); } };
  const ns=$('nSave'); if(ns)ns.onclick=async()=>{ const t=$('nT').value.trim(), bd=$('nB').value.trim(); if(!t||!bd)return alert('제목과 내용을 넣어 주세요');
    const o={title:t,body:bd,link:$('nL').value.trim()||null,until:$('nU').value||null,active:$('nA').checked,by:auth.currentUser.email}; const id=$('nId').value;
    try{ if(id)await db.collection('notices').doc(id).set(o,{merge:true}); else await db.collection('notices').add(Object.assign(o,{at:firebase.firestore.FieldValue.serverTimestamp()})); toast('공지를 저장했어요'); await loadAll(); }catch(e){ alert('저장하지 못했어요: '+(e.code||e.message)); } };
  const nc=$('nClr'); if(nc)nc.onclick=()=>render();
  document.querySelectorAll('[data-nedit]').forEach(b=>b.onclick=()=>{ const n=S.notices.find(x=>x.id===b.dataset.nedit); $('nId').value=n.id; $('nT').value=n.title||''; $('nB').value=n.body||''; $('nL').value=n.link||''; $('nU').value=n.until||''; $('nA').checked=!!n.active; $('nTitle').textContent='공지 고치기'; window.scrollTo(0,0); });
  document.querySelectorAll('[data-ntog]').forEach(b=>b.onclick=async()=>{ const n=S.notices.find(x=>x.id===b.dataset.ntog); try{ await db.collection('notices').doc(n.id).set({active:!n.active},{merge:true}); n.active=!n.active; render(); }catch(e){ alert(e.code||e.message); } });
  document.querySelectorAll('[data-ndel]').forEach(b=>b.onclick=async()=>{ if(!confirm('이 공지를 지울까요? 되돌릴 수 없어요.'))return; try{ await db.collection('notices').doc(b.dataset.ndel).delete(); await loadAll(); }catch(e){ alert(e.code||e.message); } });
  /* 피드백 */
  document.querySelectorAll('[data-fdone]').forEach(b=>b.onclick=async()=>{ const x=S.fb.find(f=>f.id===b.dataset.fdone); try{ await db.collection('feedback').doc(x.id).update({done:!x.done}); x.done=!x.done; const n=S.fb.filter(f=>!f.done).length; $('fbN').hidden=!n; $('fbN').textContent=n; render(); }catch(e){ alert(e.code||e.message); } });
  document.querySelectorAll('[data-fmemo]').forEach(b=>b.onclick=async()=>{ const x=S.fb.find(f=>f.id===b.dataset.fmemo); const m=prompt('관리자 메모',x.reply||''); if(m==null)return; try{ await db.collection('feedback').doc(x.id).update({reply:m}); x.reply=m; render(); }catch(e){ alert(e.code||e.message); } });
}
</script>
</body>
</html>
